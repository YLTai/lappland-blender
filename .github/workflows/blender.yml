name: Blender Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "model.py"
      - "render.py"
      - ".github/workflows/blender.yml"

jobs:
  build-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon0 libxxf86vm1 libxfixes3 libxi6 libxrender1 libxrandr2 libgl1 libegl1 libx11-6 libxcursor1 libxinerama1 libwayland-client0 libdecor-0-0 libdbus-1-3 libsm6

      - name: Download Blender 4.2.1
        run: |
          mkdir -p "$HOME/blender"
          curl -L "https://download.blender.org/release/Blender4.2/blender-4.2.1-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C "$HOME/blender" --strip-components=1
          "$HOME/blender/blender" --version

      - name: Build model
        run: |
          "$HOME/blender/blender" -b --python model.py

      - name: Render views
        run: |
          "$HOME/blender/blender" -b --python render.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lappland-build
          path: |
            output/
            renders/
          if-no-files-found: error
